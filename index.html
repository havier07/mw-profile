<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiniWorld Profile Tracker</title>
    <link rel="icon" href="https://play-lh.googleusercontent.com/fnvGJGqPU00v0p6oiOK_LtVmxe_-SIvAUEqnYrJPtz5pncU9G4VZuoZYmfvjPD0YBZbahsf1cPks-SyM9w2vdJ0" type="image/png">

    <meta property="og:title" content="Mini World Profile | Trình Tra Cứu Siêu Tốc">
    <meta property="og:description" content="Tra cứu thông tin, ID, ảnh đại diện, thư viện ảnh và dữ liệu người chơi Mini World CREATA nhanh chóng qua hệ thống API của Havier.">
    <meta property="og:image" content="https://raw.githubusercontent.com/Havier2111/mw-profile/main/banner.jpg">
    <meta property="og:url" content="https://mw-tracker.pages.dev">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MiniWorld Profile Tracker">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0ea5e9">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col">

    <canvas id="star-canvas"></canvas>

    <!-- Global Tooltip -->
    <div id="global-tooltip" class="fixed top-0 left-0 bg-black/90 backdrop-blur border border-white/10 px-3 py-1.5 rounded-lg text-xs text-white z-[9999] pointer-events-none transition-opacity duration-75 opacity-0 will-change-transform shadow-xl"></div>

    <main class="container mx-auto px-4 pt-4 md:pt-8 pb-24 flex-grow flex flex-col items-center max-w-5xl z-10">
        
        <!-- Header -->
        <div class="w-full max-w-3xl text-center mb-6 animate-enter">
            <h1 class="text-4xl md:text-7xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-sky-300 via-indigo-300 to-purple-300 tracking-tight drop-shadow-lg">
                MiniWorld Profile
            </h1>
            
            <!-- Search Box -->
            <div class="glass-panel rounded-2xl p-1.5 md:p-2 flex items-center shadow-2xl transition-all duration-300 focus-within:ring-2 focus-within:ring-sky-500/50 relative mt-4 md:mt-6 z-50">
                <i class="fa-solid fa-magnifying-glass text-sky-400 ml-3 md:ml-5 text-lg"></i>
                <input type="text" id="search-input" 
                    class="w-full bg-transparent border-none text-white px-3 md:px-4 py-2.5 md:py-3.5 focus:outline-none placeholder-slate-500 font-bold text-base md:text-lg font-mono tracking-wide" 
                    placeholder="Nhập UID (VD: 1000)" autocomplete="off">
                <button onclick="app.search()" 
                    class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white px-4 md:px-8 py-2 md:py-3 rounded-xl font-bold text-xs md:text-sm shadow-lg transition-all active:scale-95 whitespace-nowrap mr-1">
                    TRA CỨU
                </button>
                
                <!-- History Dropdown -->
                <div id="history-box" class="absolute top-[calc(100%+10px)] left-0 right-0 glass-panel rounded-xl overflow-hidden hidden animate-enter flex-col shadow-2xl ring-1 ring-white/10 z-[60]">
                    <div class="p-3 text-sm text-slate-400 font-bold uppercase tracking-wider flex justify-between items-center bg-black/40 backdrop-blur-md">
                        <span><i class="fa-solid fa-clock-rotate-left mr-1"></i> Lịch sử (Gần đây)</span>
                        <span class="cursor-pointer hover:text-red-400 transition p-1" onclick="app.clearHistory()">Xóa tất cả</span>
                    </div>
                    <div id="history-list" class="grid grid-cols-2 gap-2 p-2 max-h-60 overflow-y-auto custom-scroll bg-[#0b101e]"></div>
                </div>
            </div>
            <p class="text-slate-400/80 text-[10px] md:text-xs mt-2 font-medium">Author: <span class="font-mono text-sky-300">Havier</span>, UID: <span class="font-mono text-green-300">40799583</span></p>
        </div>

        <!-- Content Area -->
        <div id="content-area" class="w-full grid grid-cols-1 gap-6 md:gap-8"></div>

    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full glass-panel shadow-2xl flex items-center gap-3 transition-all duration-300 translate-y-24 opacity-0 z-[300] border-l-4 border-sky-400 w-max max-w-[90vw]">
        <i id="toast-icon" class="fa-solid fa-circle-info text-sky-400 shrink-0"></i>
        <span id="toast-msg" class="font-semibold text-sm truncate">Thông báo</span>
    </div>

    <!-- Fullscreen Image Viewer -->
    <div id="viewer" class="fixed inset-0 z-[200] bg-black/95 backdrop-blur-xl hidden opacity-0 transition-opacity duration-300 select-none flex flex-col pointer-events-none">
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start z-50 pointer-events-auto">
            <div class="flex flex-col items-start gap-1">
                <div class="text-white/90 font-mono font-bold text-lg bg-white/10 px-4 py-1 rounded-full backdrop-blur-md shadow-lg" id="v-counter">1 / 1</div>
                <div class="text-slate-300 text-sm font-medium px-4 py-2 bg-black/50 rounded-lg backdrop-blur-md border border-white/5 shadow-lg hidden" id="v-date"></div>
            </div>
            <button onclick="viewer.close()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-red-500/80 hover:text-white text-white/70 transition text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <!-- Zoom Indicator -->
        <div id="zoom-indicator" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 text-white px-4 py-2 rounded-lg font-bold opacity-0 transition-opacity duration-300 z-50 backdrop-blur-sm border border-white/10">100%</div>

        <div class="flex-grow w-full h-full relative overflow-hidden flex items-center justify-center pointer-events-auto cursor-grab active:cursor-grabbing" id="v-container">
            <img id="v-img" class="max-w-full max-h-full object-contain will-change-transform" draggable="false">
        </div>
        <button onclick="viewer.nav(-1)" class="absolute left-2 md:left-4 top-1/2 -translate-y-1/2 w-10 md:w-12 h-10 md:h-12 flex items-center justify-center rounded-full bg-black/20 hover:bg-white/20 text-white/50 hover:text-white transition z-40 backdrop-blur-sm pointer-events-auto"><i class="fa-solid fa-chevron-left text-xl"></i></button>
        <button onclick="viewer.nav(1)" class="absolute right-2 md:right-4 top-1/2 -translate-y-1/2 w-10 md:w-12 h-10 md:h-12 flex items-center justify-center rounded-full bg-black/20 hover:bg-white/20 text-white/50 hover:text-white transition z-40 backdrop-blur-sm pointer-events-auto"><i class="fa-solid fa-chevron-right text-xl"></i></button>
        
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1.5 md:gap-2 px-4 py-2.5 rounded-2xl bg-black/70 backdrop-blur-md border border-white/10 shadow-2xl max-w-[90vw] overflow-x-auto no-scrollbar">
            <button onclick="viewer.zoom(0.3)" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-white flex items-center justify-center transition shrink-0" title="Phóng to (+)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button onclick="viewer.zoom(-0.3)" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-white flex items-center justify-center transition shrink-0" title="Thu nhỏ (-)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button onclick="viewer.toggleOneToOne()" class="px-3 h-10 md:h-11 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 active:scale-95 text-sky-300 font-bold font-mono text-xs md:text-sm border border-sky-500/30 flex items-center justify-center transition shrink-0" title="Kích thước thực (1:1 / 0)">1:1</button>
            
            <div class="w-[1px] h-6 bg-white/10 mx-1 shrink-0"></div>

            <button onclick="viewer.rotate(-90)" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-white flex items-center justify-center transition shrink-0" title="Xoay trái"><i class="fa-solid fa-rotate-left"></i></button>
            <button onclick="viewer.rotate(90)" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-white flex items-center justify-center transition shrink-0" title="Xoay phải"><i class="fa-solid fa-rotate-right"></i></button>
            <button onclick="viewer.flipH()" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-white flex items-center justify-center transition shrink-0" title="Lật ngang"><i class="fa-solid fa-right-left"></i></button>
            <button onclick="viewer.flipV()" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-white flex items-center justify-center transition shrink-0" title="Lật dọc"><i class="fa-solid fa-up-down"></i></button>
            
            <div class="w-[1px] h-6 bg-white/10 mx-1 shrink-0"></div>

            <button onclick="viewer.openSource()" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 text-purple-300 flex items-center justify-center transition shrink-0" title="Mở link gốc"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
            <button onclick="viewer.download()" class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-green-500/20 hover:bg-green-500/30 active:scale-95 text-green-300 border border-green-500/30 flex items-center justify-center transition shrink-0" title="Tải về"><i class="fa-solid fa-download"></i></button>
        </div>
    </div>

    <!-- Code Modal -->
    <div id="json-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-2 md:p-6">
        <div id="json-box" class="bg-[#0b101e] border border-white/15 rounded-3xl w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl overflow-hidden scale-95 transition-transform duration-300">
            
            <div class="px-6 py-4 border-b border-white/10 flex justify-between items-center bg-white/[0.02] shrink-0">
                <h3 id="modal-title" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-code text-sky-400"></i> JSON DATA
                </h3>
                
                <button onclick="app.closeModal()" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-rose-500/80 hover:text-white active:scale-95 text-slate-300 flex items-center justify-center transition shadow-lg" title="Đóng (ESC)">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="px-6 py-3 border-b border-white/5 bg-black/40 flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-2">
                    <button onclick="app.toggleAllJson(true)" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 active:scale-95 text-slate-300 hover:text-white rounded-xl text-xs font-semibold border border-white/5 transition flex items-center gap-1.5" title="Bung mở tất cả">
                        <i class="fa-solid fa-folder-open text-amber-400"></i> <span class="hidden sm:inline">Mở hết</span>
                    </button>
                    <button onclick="app.toggleAllJson(false)" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 active:scale-95 text-slate-300 hover:text-white rounded-xl text-xs font-semibold border border-white/5 transition flex items-center gap-1.5" title="Thu gọn tất cả">
                        <i class="fa-solid fa-folder-closed text-sky-400"></i> <span class="hidden sm:inline">Gom lại</span>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="app.copyContent()" class="px-3 py-1.5 bg-sky-500/20 hover:bg-sky-500/30 active:scale-95 text-sky-300 rounded-xl text-xs font-semibold border border-sky-500/30 transition flex items-center gap-1.5">
                        <i class="fa-regular fa-copy"></i> Copy JSON
                    </button>
                    <button onclick="app.dlContent()" class="px-3 py-1.5 bg-green-500/20 hover:bg-green-500/30 active:scale-95 text-green-300 rounded-xl text-xs font-semibold border border-green-500/30 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-download"></i> Tải về
                    </button>
                </div>
            </div>

            <div id="json-viewer-container" class="flex-grow overflow-y-auto p-4 md:p-6 select-text custom-scrollbar">
                <div id="code-viewer" class="min-h-full"></div>
            </div>

        </div>
    </div>

    <!-- 1. VS CODE SMART LINK TOOLTIP (Xem trước ảnh & Thông số) -->
    <div id="link-tooltip" class="fixed z-[300] w-64 bg-[#0d1117]/95 border border-slate-700/80 rounded-xl shadow-2xl backdrop-blur-md pointer-events-none opacity-0 transition-opacity duration-150 overflow-hidden hidden flex-col font-sans text-xs">
        <div class="px-3 py-2 bg-slate-800/50 border-b border-slate-700/60 text-slate-300 font-mono font-bold flex justify-between items-center" id="lt-header">
            <span class="truncate pr-2" id="lt-title">Image Link</span>
            <span class="text-[10px] text-sky-400 font-normal shrink-0" id="lt-size">Loading...</span>
        </div>
        <div class="p-2 bg-black/60 flex items-center justify-center min-h-[140px] max-h-[180px] overflow-hidden relative">
            <div id="lt-spinner" class="absolute inset-0 flex items-center justify-center text-sky-400/50"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i></div>
            <img id="lt-img" class="max-w-full max-h-[160px] object-contain rounded border border-white/5 opacity-0 transition-opacity duration-300 relative z-10" src="">
        </div>
        <div class="px-3 py-1.5 bg-slate-900/80 border-t border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">
            <span class="text-sky-300"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Follow link</span>
            <kbd class="px-1.5 py-0.5 bg-white/10 rounded text-[10px] text-slate-300 font-mono">ctrl + click</kbd>
        </div>
    </div>

    <!-- 2. ACTION MENU POPUP (Menu tùy chọn khi Click link trên PC & Mobile PE) -->
    <div id="link-menu-overlay" class="fixed inset-0 z-[350] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200 flex items-end md:items-center justify-center p-4" onclick="app.closeLinkMenu(event)">
        <div id="link-menu-box" class="bg-[#0f172a] border border-white/15 rounded-3xl md:rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl scale-95 transition-all duration-200 flex flex-col" onclick="event.stopPropagation()">
            <!-- Header hiển thị link mini -->
            <div class="p-4 bg-white/[0.03] border-b border-white/10 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 shrink-0"><i class="fa-solid fa-link text-lg"></i></div>
                <div class="min-w-0 flex-grow">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tùy chọn liên kết</div>
                    <div class="text-xs text-sky-300 font-mono truncate" id="lm-url-text">http://...</div>
                </div>
            </div>
            <!-- Danh sách nút hành động -->
            <div class="p-2 flex flex-col gap-1 font-medium text-sm text-slate-200">
                <button onclick="app.lmAction('preview')" class="w-full px-4 py-3 rounded-xl hover:bg-white/10 active:scale-[0.98] flex items-center gap-3 transition text-left text-sky-300 font-bold"><i class="fa-solid fa-expand w-5 text-center text-lg"></i> Xem ảnh toàn màn hình</button>
                <button onclick="app.lmAction('open')" class="w-full px-4 py-3 rounded-xl hover:bg-white/10 active:scale-[0.98] flex items-center gap-3 transition text-left"><i class="fa-solid fa-arrow-up-right-from-square w-5 text-center text-purple-400"></i> Mở trong Tab mới</button>
                <button onclick="app.lmAction('copy-url')" class="w-full px-4 py-3 rounded-xl hover:bg-white/10 active:scale-[0.98] flex items-center gap-3 transition text-left"><i class="fa-regular fa-copy w-5 text-center text-amber-400"></i> Sao chép liên kết</button>
                <button onclick="app.lmAction('download')" class="w-full px-4 py-3 rounded-xl hover:bg-white/10 active:scale-[0.98] flex items-center gap-3 transition text-left text-green-400"><i class="fa-solid fa-download w-5 text-center"></i> Tải ảnh về máy</button>
            </div>
            <!-- Nút đóng cho Mobile -->
            <div class="p-2 border-t border-white/5 md:hidden">
                <button onclick="app.closeLinkMenu()" class="w-full py-3 bg-white/5 rounded-xl font-bold text-slate-400 text-center">Hủy bỏ</button>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
